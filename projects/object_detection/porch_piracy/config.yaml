# Porch piracy. Merged over the root config.yaml: only what differs goes here.
# Model paths are relative to this folder.

model:
  task: "object detection"
  network_file: "models/network.rpk"  # not in git: `make model PROJECT=porch_piracy`
  labels_file: "labels.txt"
  threshold: 0.55

stream:
  rtsp_url: "rtsp://127.0.0.1:8554/porch"

mqtt:
  enabled: true
  topic: porch/events
  username: porch

analysis:
  tracker:
    min_score: 0.25       # low scores only keep tracks alive (person holding a box: 0.27-0.50)
    track_thresh: 0.45    # a new track needs > 0.55 (IMX500 level 0.62)
    max_low_streak: 15    # a track living on low scores only is ignored after this
  motion:
    scale: 0.5
  detections: [person, package]  # track appeared / gone → MQTT event
  relations:
    # A person with a package inside their box who is moving
    - name: carrying_package
      subject: person
      objects: [package]
      moving: true
  alerts: [carrying_package]     # clip (clips.seconds before/after) + Telegram

annotator:
  colors:
    classes:
      package: "#f9e2af"  # yellow
      person: "#cba6f7"   # mauve
