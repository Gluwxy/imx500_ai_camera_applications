# Shared defaults for every project. Each project overrides what it needs in
# projects/<task>/<project>/config.yaml (merged key by key over this file).
# Secrets (TELEGRAM_TOKEN, MQTT_PASSWORD) come from .env in the repo root.

camera:
  preview_type: "null"
  config_type: "video"
  framerate: 10
  resolution: [640, 640]
  buffer_count: 6

stream:
  rtsp_url: "rtsp://127.0.0.1:8554/stream"
  bitrate: 2000000
  iperiod: 15

# Alert clips: `seconds` before and after each alert (CircularOutput2)
clips:
  seconds: 5
  dir: data/clips       # relative to the repo root (git-ignored)
  max_clips: 20         # oldest clips are deleted to protect the microSD

# Box colors (Catppuccin Mocha). Projects set `annotator.colors.classes`.
annotator:
  legend: false         # optional chips (classes, states) in the top-left corner
  show_motion: false    # draw the Motion boxes (debug)
  fill_alpha: 0.4       # translucent fill inside the boxes (0 = outline only)
  show_detections: true # initial state of the dashboard "Show detections" toggle
  colors:
    default: "#a6adc8"  # subtext0: classes without their own color
    alert: "#f38ba8"    # red: subject of an active alert relation
    moving: "#a6e3a1"   # green: subject moving (relations with `moving: true`)
    motion: "#b4befe"   # lavender: Motion boxes and the "motion" chip

# Web dashboard: live WebRTC view, hardware metrics, alert clips
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8000
  whep_port: 8889       # MediaMTX WebRTC (WHEP) port used by the browser

mqtt:
  enabled: false        # needs a broker (e.g. Mosquitto); projects enable it
  host: localhost
  port: 1883
  topic: imx500/events

telegram:
  enabled: true         # needs TELEGRAM_TOKEN in .env
  chat_id: 123456789
  cooldown_s: 60
