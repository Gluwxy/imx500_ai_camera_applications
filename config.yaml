# Shared defaults for every project. Each project overrides what it needs in
# projects/<task>/<project>/config.yaml (merged key by key over this file).
# Secrets (TELEGRAM_TOKEN, MQTT_PASSWORD) come from .env in the repo root.

camera:
  preview_type: "null"
  config_type: "video"
  framerate: 10
  resolution: [640, 640]
  buffer_count: 6

stream:
  rtsp_url: "rtsp://127.0.0.1:8554/stream"
  bitrate: 2000000
  iperiod: 15

dashboard:
  host: "0.0.0.0"
  port: 8000

mqtt:
  host: localhost
  port: 1883
  topic: imx500/events

telegram:
  chat_id: 123456789
  cooldown_s: 60
