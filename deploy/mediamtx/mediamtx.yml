# MediaMTX: only RTSP (TCP, the app publishes here) and WebRTC (dashboard
# preview, port 8889) are enabled. The control API listens on localhost only:
# the dashboard reads it to list the stream sources.
api: yes
apiAddress: 127.0.0.1:9997
rtmp: no
hls: no
webrtc: yes
srt: no
moq: no
rtspTransports: [tcp]

paths:
  # Any stream path a project publishes (stream.rtsp_url in its config.yaml,
  # e.g. rtsp://127.0.0.1:8554/porch)
  all_others:
    source: publisher
