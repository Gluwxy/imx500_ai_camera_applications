<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Porch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-inner">
            <a class="brand" href="#live">Smart Porch</a>

            <button id="nav-toggle" class="nav-toggle" type="button"
                    aria-controls="nav-menu" aria-expanded="false" aria-label="Open menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav id="nav-menu" class="menu" aria-label="Sections">
                <a href="#live" data-section="live">
                    <span class="material-symbols-outlined" aria-hidden="true">videocam</span>
                    <span>Live</span>
                </a>
                <a href="#hardware" data-section="hardware">
                    <span class="material-symbols-outlined" aria-hidden="true">memory</span>
                    <span>Hardware</span>
                </a>
                <a href="#events" data-section="events">
                    <span class="material-symbols-outlined" aria-hidden="true">campaign</span>
                    <span>Events</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Live: WebRTC video -->
        <section id="live" class="page">
            <h2 class="section-title">
                <span class="material-symbols-outlined" aria-hidden="true">videocam</span>
                <span>Live</span>
            </h2>

            <div class="video-wrap">
                <video id="videoElement" autoplay muted playsinline controls></video>
                <span class="live-badge">LIVE</span>
            </div>

            <div class="controls">
                <button id="btnConnect" class="button" type="button">Connect</button>
            </div>

            <div class="stream-options">
                <label class="check">
                    <input id="toggle-detections" type="checkbox" checked>
                    <span>Show detections</span>
                </label>
                <label class="field">
                    <span>Source</span>
                    <select id="stream-source" class="select" aria-label="WebRTC stream source"></select>
                </label>
            </div>
        </section>

        <!-- Hardware: health dashboards -->
        <section id="hardware" class="page" hidden>
            <h2 class="section-title">
                <span class="material-symbols-outlined" aria-hidden="true">memory</span>
                <span>Hardware</span>
            </h2>

            <div class="badges">
                <span id="badge-watchdog" class="badge" data-state="unknown">Watchdog: —</span>
                <span id="badge-throttling" class="badge" data-state="unknown">Throttling: —</span>
            </div>

            <div id="gauges" class="gauges"></div>
        </section>

        <!-- Events: alert clips recorded by CircularOutput2 (data/clips) -->
        <section id="events" class="page" hidden>
            <h2 class="section-title">
                <span class="material-symbols-outlined" aria-hidden="true">campaign</span>
                <span>Events</span>
            </h2>

            <h3 class="subtitle">Alert clips</h3>
            <ul id="events-list" class="events">
                <li class="empty">No clips yet</li>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-title">Raspberry Pi AI Camera (IMX500)</span>
            <span id="last-update" data-state="unknown">Waiting for data…</span>
        </div>
    </footer>

    <template id="event-template">
        <li class="event">
            <button class="event-head" type="button" aria-expanded="false" aria-label="Show clip">
                <time class="event-time"></time>
                <span class="event-text"></span>
                <span class="event-toggle"><span class="material-symbols-outlined">arrow_drop_down</span></span>
            </button>
            <div class="event-body" hidden>
                <span class="clip-status">Recording clip…</span>
                <div class="clip-player" hidden>
                    <video class="clip-video" controls playsinline preload="none"></video>
                    <a class="clip-download" download>Download clip</a>
                </div>
            </div>
        </li>
    </template>

    <template id="gauge-template">
        <div class="gauge">
            <svg viewBox="0 0 200 125" aria-hidden="true">
                <path class="track" d="M 20 110 A 80 80 0 0 1 180 110"/>
                <path class="fill" d="M 20 110 A 80 80 0 0 1 180 110" pathLength="100"/>
            </svg>
            <div class="scale">
                <span class="scale-min">0</span>
                <span class="scale-max">—</span>
            </div>
            <div class="value"><span class="value-num">—</span> <small class="value-unit"></small></div>
            <div class="label"></div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
