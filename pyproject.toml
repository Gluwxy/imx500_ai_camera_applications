[project]
name = "imx500_ai_camera_applications"
version = "0.1.0"
description = "Raspberry Pi AI Camera (IMX500) applications"
authors = [
    { name = "José Ismael Salas Morales", email = "jose.salas.ibt@gmail.com" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13,<3.14"  # Trixie ships 3.13; modlib supports < 3.14 

dependencies = [
    "modlib>=1.3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0",
]

[project.scripts]
imx500_ai_camera_applications = "imx500_core.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "imx500_core"

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"  # summary of skipped tests and their reason

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
